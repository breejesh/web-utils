<app-tool-layout [tool]="tool">
  <div class="options surface">
    <label class="field" style="max-width:180px">
      <span class="field-label">Character set</span>
      <select class="select" [(ngModel)]="charset" (ngModelChange)="onInput()">
        @for (c of charsets; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </label>
    <label class="check"><input type="checkbox" [(ngModel)]="urlSafe" (ngModelChange)="onInput()" /> URL-safe (Base64URL)</label>
    <label class="check"><input type="checkbox" [(ngModel)]="decodeLinesSeparately" (ngModelChange)="onInput()" /> Decode / encode each line separately</label>
    <label class="check"><input type="checkbox" [(ngModel)]="liveMode" /> Live mode (as you type)</label>
    <label class="check"><input type="checkbox" [(ngModel)]="wrap" /> Soft-wrap</label>
  </div>

  <div class="toolbar">
    <div class="segmented" role="radiogroup" aria-label="Encode or decode">
      <button type="button" class="seg-btn" role="radio" [attr.aria-checked]="mode === 'encode'" [class.active]="mode === 'encode'" (click)="setMode('encode')">Encode</button>
      <button type="button" class="seg-btn" role="radio" [attr.aria-checked]="mode === 'decode'" [class.active]="mode === 'decode'" (click)="setMode('decode')">Decode</button>
    </div>
    @if (!liveMode) {
      <button type="button" class="btn btn-primary" (click)="run()">{{ mode === 'encode' ? 'Encode' : 'Decode' }}</button>
    }
    <button type="button" class="btn btn-ghost" (click)="swap()" title="Move output to input and flip mode"><svg appIcon="arrow-left-right"></svg> Swap</button>
    <button type="button" class="btn btn-quiet" (click)="sample()">Sample</button>
    <span class="spacer"></span>
    <label class="btn btn-quiet btn-sm file-btn"><svg appIcon="arrow-up"></svg> Encode file<input type="file" hidden (change)="onEncodeFile($event)" /></label>
    <label class="btn btn-quiet btn-sm file-btn"><svg appIcon="arrow-up"></svg> Decode .b64 file<input type="file" accept=".txt,.b64,.base64,text/plain" hidden (change)="onDecodeFile($event)" /></label>
    <button type="button" class="btn btn-quiet btn-sm" (click)="downloadDecodedBinary()"><svg appIcon="arrow-down"></svg> Binary</button>
    <button type="button" class="btn btn-quiet btn-sm" (click)="downloadTextOut()" [disabled]="!output"><svg appIcon="arrow-down"></svg> Text</button>
    <span class="toolbar-sep"></span>
    <button type="button" class="btn btn-quiet btn-sm" (click)="clear()"><svg appIcon="trash"></svg> Clear</button>
  </div>

  @if (fileInfo) {
    <div class="meta-row"><span class="chip chip-accent">{{ fileInfo }}</span></div>
  }
  @if (error) {
    <div class="error-box">{{ error }}</div>
  }

  <div class="workspace-fill grid-2">
    <div class="panel surface workspace-pane">
      <div class="panel-head">
        <h3 class="panel-title">{{ mode === 'decode' ? 'Base64 input' : 'Plain text / binary data-URL' }}</h3>
        <div class="panel-actions">
          <span class="meta-row">{{ input.length }} chars</span>
          <button type="button" class="btn btn-ghost btn-sm" (click)="clip.copy(input)"><svg appIcon="copy"></svg> Copy</button>
        </div>
      </div>
      <textarea
        class="textarea fill"
        [(ngModel)]="input"
        [appToolHistory]="tool.slug"
        placeholder="Paste Base64 to decode, or text to encode…"
        (ngModelChange)="onInput()"
        [style.whiteSpace]="wrap ? 'pre-wrap' : 'pre'"
        spellcheck="false"
      ></textarea>
    </div>
    <div class="panel surface workspace-pane">
      <div class="panel-head">
        <h3 class="panel-title">Output</h3>
        <div class="panel-actions">
          <span class="meta-row">{{ output.length }} chars</span>
          <button type="button" class="btn btn-ghost btn-sm" (click)="clip.copy(output)" [disabled]="!output"><svg appIcon="copy"></svg> Copy</button>
        </div>
      </div>
      <textarea
        class="textarea fill"
        [(ngModel)]="output"
        placeholder="Result appears here…"
        [style.whiteSpace]="wrap ? 'pre-wrap' : 'pre'"
        spellcheck="false"
      ></textarea>
    </div>
  </div>

</app-tool-layout>
