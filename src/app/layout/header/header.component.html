<header class="header">
  <div class="header-inner">
    <button
      type="button"
      class="btn btn-quiet btn-icon menu-btn"
      (click)="menuToggle.emit()"
      aria-label="Open tools menu"
      aria-controls="sidebar"
      [attr.aria-expanded]="menuOpen">
      <svg appIcon="menu" [size]="18"></svg>
    </button>

    <a routerLink="/" class="mobile-brand" [attr.aria-label]="siteName + ' home'">
      <app-brand-mark [size]="26" />
    </a>

    <button type="button" class="search-trigger" (click)="palette.open()" aria-haspopup="dialog" aria-label="Search tools">
      <svg appIcon="search" [size]="15"></svg>
      <span class="placeholder">Search {{ toolCount }} tools<span class="long">, or paste anything…</span></span>
      <span class="keys" aria-hidden="true"><kbd>{{ modKey() }}</kbd><kbd>K</kbd></span>
    </button>

    <div class="header-actions">
      <span class="offline-pill chip" title="Every tool runs in this tab. Nothing is uploaded.">
        <svg appIcon="shield-check" [size]="12"></svg>
        100% local
      </span>
      <a
        class="btn btn-quiet btn-icon"
        [href]="repoUrl"
        target="_blank"
        rel="noopener"
        aria-label="Source code on GitHub">
        <svg appIcon="github" [size]="17"></svg>
      </a>
      <button type="button" class="btn btn-quiet btn-icon" (click)="theme.cycle()" [attr.aria-label]="themeLabel()" [title]="themeLabel()">
        <svg [appIcon]="themeIcon()" [size]="17"></svg>
      </button>
    </div>
  </div>
</header>
