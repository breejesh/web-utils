<header class="header">
  <div class="header-inner">
    <button type="button" class="btn btn-ghost btn-icon menu-btn" (click)="menuToggle.emit()" aria-label="Toggle tools menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
      </svg>
    </button>

    <label class="search" aria-label="Search tools">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.5-3.5" stroke-linecap="round" />
      </svg>
      <input
        class="input search-input"
        type="search"
        placeholder="Search tools… (Base64, JWT, JSON)"
        [ngModel]="search"
        (ngModelChange)="onSearch($event)"
        autocomplete="off"
        spellcheck="false" />
      @if (search) {
      <button type="button" class="clear" (click)="clearSearch()" aria-label="Clear search">×</button>
      }
    </label>

    <div class="header-actions">
      <!-- <span class="privacy-pill chip chip-accent" title="{{ privacyTagline }}">
        <span class="dot" aria-hidden="true"></span>
        100% local
      </span> -->

      <button
        type="button"
        class="btn btn-ghost btn-icon theme-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme.theme() === 'dark') {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round" />
        </svg>
        } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" stroke-linejoin="round" />
        </svg>
        }
      </button>
    </div>
  </div>
</header>
