  <!-- Apply the saved theme before first paint (keep in sync with ThemeService). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('web-utils-theme');
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') document.documentElement.classList.add('light-theme');
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
